    <script nonce="TQ7R6SCYciWojr1uBwDbyg==" type="application/ld+json">{"@context":"http://schema.org/","@type":"Dataset","name":"BenchRec: A Real-World Cash Reconciliation Dataset","description":"BenchRec: Tier 1 Bank Cash Reconciliation Dataset (Transaction Matching)\n\nMatching financial transactions is one of the most time-consuming back-office tasks in financial services.\nThis dataset represents a real-world cash reconciliation problem where bank statement transactions must be matched to internal ledger transactions — a core workflow in banking, asset management, payments, and operations teams.\nRules-based systems struggle with noisy data and edge cases, leaving large volumes for manual review. This dataset is designed to support machine learning–based transaction matching that improves straight-through processing (STP) while controlling false matches.\n\nOriginally released as part of the ICAIF 2023 Benchmark Competition\nhttps://ai-finance.org/icaif-23/\n\n🎯 Task Definition (What you are predicting)\nGiven a transaction of type B (external statement entry), predict the key characteristics of the transaction(s) of type A (internal ledger entries) that it should match to.\nInstead of predicting specific transaction IDs, the model predicts a business-meaningful allocation key:\nA_allocation = currency + account + transaction attributes\nThis reflects how reconciliation is validated operationally: a match is considered correct if the predicted allocation corresponds to the correct financial characteristics, even if the internal transaction IDs differ.\n---\n\n🧠 Matching Rules &amp; Ground Truth\n\n- Not all B-transactions have a valid match → targetAllocation may be blank\n- One-to-many and many-to-one matches are possible\n- Each A-transaction and B-transaction can belong to only one match\n- A prediction is considered correct if the predicted allocation set is:\n\t- equal to, or\n\t- a subset of the true allocation set\nThis mirrors real reconciliation workflows where as long as the predicted allocation is more specific than the actual set of allocations, then that prediction can be considered as correct.\n\n\n📊 Evaluation Metrics (What “good” looks like)\n\n\nIn production,  erroneous matches are costly. It is better to leave a transaction unmatched (and leave it for manual review) than to match it incorrectly.  The required precision for fully automated matches it 99.9%. However for this dataset this required precision has been reduced to 99.8% in order to account for labels errors which were identified at a rate of 0.2%.\nThe match rate should be optimized subject to the match precision meeting the required level.\nYou should meet the threshold for match precision. (\n- Match Rate\n  Fraction of true matches your model successfully identifies.\n- Match  Precision\n  Fraction of your predicted matches that are correct.\n\n🧪 Suggested Baselines &amp; Experiments\n\nThis dataset supports experimentation with:\n- Rules engines vs ML matchers\n- Fellegi-Sunter matching\n- Confidence-scored predictions\n- Explainable matching (audit-ready reasoning)\n---\n\n📁 What’s in the Dataset\n\n- Real-world transaction pairs\n- Ground-truth allocation targets (targetAllocation)\n- Fields enabling amount, date, currency, and account-based matching\n- Support for partial, grouped, and null matches\n---\n\n💡 Bonus (Optional Outputs)\n\nModels may optionally provide:\n- A human-readable explanation of why a match was made (important for audit/compliance)\n- A confidence score per match\n","url":"https://www.kaggle.com/benchmarkteam/benchrec-real-world-cash-reconciliation-dataset","version":3,"keywords":["task, classification","data type, tabular","subject, people and society, business, finance","language, english","task, multiclass classification"],"license":{"@type":"CreativeWork","name":"Attribution 4.0 International (CC BY 4.0)","url":"https://creativecommons.org/licenses/by/4.0/"},"identifier":["9502956"],"includedInDataCatalog":{"@
